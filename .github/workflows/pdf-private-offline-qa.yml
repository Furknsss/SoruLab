name: Private source PDF offline acceptance

# Real private-book acceptance requires a per-run encrypted fixture uploaded
# for that runner's ephemeral public key. Automatic pushes have no such fixture:
# they otherwise occupy an Android runner waiting 20 minutes and cannot certify
# book accuracy. Keep this a mandatory manually dispatched RELEASE gate.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-offline-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Prepare ephemeral private-source transport
        run: |
          python3 -m pip install cryptography
          python3 scripts/private_pdf_fixture_crypto.py generate \
            "$RUNNER_TEMP/pdf-fixture-key.pem" app/build/public-fixture-key
      - uses: actions/upload-artifact@v4
        with:
          name: sorulab-public-fixture-key
          path: app/build/public-fixture-key/
          retention-days: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Receive encrypted source pages for this runner only
        run: >-
          python3 scripts/private_pdf_fixture_crypto.py receive
          "$RUNNER_TEMP/pdf-fixture-key.pem" app/build/public-fixture-key/public-key.pem
          app/src/androidTest/assets/private-corpus
          "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
      - name: Configure disposable QA device
        run: |
          sudo chmod a+rw /dev/kvm
          keytool -genkeypair -noprompt -keystore debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -dname 'CN=Private Offline QA,O=SoruLab,C=TR' -keyalg RSA -keysize 2048 -validity 2
      - name: Import real source examples with all device networking disabled
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: '-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none'
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            adb shell cmd connectivity airplane-mode enable
            adb shell svc wifi disable
            adb shell svc data disable
            bash ./gradlew :app:connectedDebugAndroidTest --no-daemon --no-configuration-cache --max-workers=2 -Pandroid.testInstrumentationRunnerArguments.class=com.example.util.PdfPrivateCorpusDeviceTest -Pandroid.testInstrumentationRunnerArguments.sorulab.privateCorpus=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sorulab-private-offline-results
          path: app/build/outputs/androidTest-results/connected/**/*.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Delete ephemeral plaintext and decryption material
        if: always()
        run: |
          rm -rf app/src/androidTest/assets/private-corpus app/build/outputs/apk/androidTest
          rm -f "$RUNNER_TEMP/pdf-fixture-key.pem"
