name: Gemini PDF live synthetic canary

on:
  workflow_dispatch:
  push:
    branches:
      - feat/pdf-vision-gemini38-grounded-20261104
    paths:
      - 'app/src/androidTest/java/com/example/util/PdfVisionGeminiLiveDeviceTest.kt'
      - 'app/src/main/java/com/example/util/PdfVisionGeminiEngine.kt'
      - 'app/src/main/java/com/example/util/PdfVisionImportPolicy.kt'
      - '.github/workflows/pdf-gemini-live-canary.yml'

permissions:
  contents: read

concurrency:
  group: pdf-gemini-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remote-vision-live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Prepare Android emulator
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          keytool -genkeypair -noprompt -keystore debug.keystore \
            -storepass android -keypass androiddebugkey -alias androiddebugkey \
            -dname 'CN=Android Vision Canary Only,O=SoruLab,C=TR' \
            -keyalg RSA -keysize 2048 -validity 2
      - name: Require registered Firebase App Check debug credential
        env:
          SORULAB_APPCHECK_DEBUG_TOKEN: ${{ secrets.SORULAB_APPCHECK_DEBUG_TOKEN }}
        run: |
          if test -z "$SORULAB_APPCHECK_DEBUG_TOKEN"; then
            echo "::error::Firebase App Check rejects GitHub emulators. Register a DEBUG token in Firebase Console, then add it as Actions secret SORULAB_APPCHECK_DEBUG_TOKEN. Production enforcement stays enabled."
            exit 1
          fi
      - name: Request live structured output from Firebase AI Gemini 3.8 Flash
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SORULAB_APPCHECK_DEBUG_TOKEN: ${{ secrets.SORULAB_APPCHECK_DEBUG_TOKEN }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: '-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none'
          disable-animations: true
          emulator-boot-timeout: 600
          script: >-
            bash ./gradlew :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.example.util.PdfVisionGeminiLiveDeviceTest
            -Pandroid.testInstrumentationRunnerArguments.sorulab.liveVision=true
            -Pandroid.testInstrumentationRunnerArguments.sorulab.appCheckDebugToken="$SORULAB_APPCHECK_DEBUG_TOKEN"
            --no-daemon --no-configuration-cache --max-workers=2
      - name: Preserve live Firebase API result and Android test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sorulab-gemini-live-canary
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: ignore
          retention-days: 5
