name: PDF Android device OCR and crop smoke

on:
  push:
    branches:
      - fix/rc9-consensus-no-anchor-regression
    paths:
      - 'app/src/androidTest/**'
      - 'app/src/main/java/com/example/util/**'
      - 'app/src/main/java/com/example/viewmodel/AiSolverViewModel.kt'
      - 'app/src/main/java/com/example/data/SoruLabModels.kt'
      - 'app/build.gradle.kts'
      - '.github/workflows/pdf-ocr-device-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-android-device-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-device-ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install required Android compile SDK
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Configure emulator virtualization
        run: |
          if test -e /dev/kvm; then
            sudo chmod a+rw /dev/kvm
          else
            echo 'ERROR: Host does not expose /dev/kvm, device OCR cannot be certified'
            exit 1
          fi
      - name: Generate disposable local-only debug signing key
        run: |
          keytool -genkeypair -noprompt -keystore debug.keystore \
            -storepass android -keypass androiddebugkey -alias androiddebugkey \
            -dname 'CN=Android QA Only,O=SoruLab,C=TR' -keyalg RSA \
            -keysize 2048 -validity 2
      - name: Execute actual on-device ML Kit and question-crop integration
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: '-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none'
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            bash ./gradlew :app:connectedDebugAndroidTest --no-daemon --no-configuration-cache --max-workers=2
            # Capture ORIGINAL QA fixtures only, no copyrighted book pages.
            mkdir -p app/build/qa-device-screenshots
            # Android instrumentation may write screenshots under the test
            # package's external files directory instead of the target app's.
            # Discover the real directory rather than assuming its package.
            adb shell 'find /sdcard/Android/data -type f -name denemeler-phone.png 2>/dev/null' | tr -d '\r' > app/build/qa-device-screenshots/paths.txt
            echo "Found QA screenshots:"
            cat app/build/qa-device-screenshots/paths.txt
            screen_path="$(head -n 1 app/build/qa-device-screenshots/paths.txt)"
            if test -z "$screen_path"; then
              echo 'ERROR: UI screenshot was not saved on device'
              adb shell 'ls -l /sdcard/Android/data/*/files/qa-screens/ 2>/dev/null' || true
              exit 1
            fi
            screen_dir="${screen_path%/*}"
            adb pull "$screen_dir/." app/build/qa-device-screenshots/
            test -s app/build/qa-device-screenshots/denemeler-phone.png
            test -s app/build/qa-device-screenshots/solving-board-phone.png
      - name: Archive device screenshots and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sorulab-android-device-ocr-smoke
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
            app/build/qa-device-screenshots/
          if-no-files-found: ignore
          retention-days: 7
