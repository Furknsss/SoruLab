name: PDF preview APK
on:
  workflow_dispatch:
  push:
    branches: ['feat/premium-pdf-v5', 'fix/pdf-rc5-patternsyntax-regression', 'fix/rc7-auth-universal-pdf-layout-ink', 'fix/rc8-pdf-completeness-spen-layout', 'fix/rc9-universal-pdf-ocr-crop-quality']
  pull_request:
    branches: ['feat/premium-pdf-v5', 'feat/pdf-v5-biyotik-premium-review', 'feat/s-pen-s9feplus-ink-gestures', 'fix/rc7-auth-universal-pdf-layout-ink', 'fix/rc8-pdf-completeness-spen-layout']
permissions:
  contents: read
# A new commit supersedes old RC8 test runs, preventing dozens of outdated
# Android builds from blocking the current acceptance suite.
concurrency:
  group: pdf-preview-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android platform tools
        uses: android-actions/setup-android@v3
        with:
          # setup-android defaults to the removed "tools" SDK package.
          # Match the existing release workflow instead of installing that default.
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Preflight all literal Kotlin regular expressions
        run: python3 scripts/validate_kotlin_raw_regex.py
      - name: Run answer-key matching regression tests
        run: >-
          bash ./gradlew :app:testDebugUnitTest
          --tests com.example.util.StylusInputPolicyTest
          --tests com.example.util.PdfOptionEvidenceTest
          --tests com.example.util.PdfAdaptiveAnswerRowsTest
          --tests com.example.util.PdfScopedAnswerKeysTest
          --tests com.example.util.PdfTextFooterKeysTest
          --tests com.example.util.PdfVectorAnswerStripTest
          --tests com.example.util.PdfVectorQuestionAnchorsTest
          --tests com.example.util.PdfVectorTestMarkerTest
          --tests com.example.util.PdfPrintedAnchorConsensusTest
          --tests com.example.util.PdfNativeQuestionEvidenceTest
          --tests com.example.util.PdfCropGeometryAuditTest
          --tests com.example.util.PdfVectorPageHeaderTest
          --tests com.example.util.PdfColumnLayoutEvidenceTest
          --tests com.example.util.PdfColumnGeometryTest
          --tests com.example.util.PdfAdaptiveGutterTest
          --tests com.example.util.PdfCropRecoveryPolicyTest
          --tests com.example.util.PdfOcrQuestionMarkerTest
          --tests com.example.util.PdfSourceHeaderExtractorTest
          --tests com.example.util.PdfLibraryAccountTest
          --tests com.example.data.LocalQuestionCacheIOTest
          --tests com.example.util.TestAnswerAnalyticsEngineTest
          --tests com.example.data.TestSnapshotCodecTest
          --no-daemon --no-configuration-cache --max-workers=2
      - name: Upload answer-key test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SoruLab-answer-key-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
      # Verify APK packaging independently of the private preview signing key.
      # The disposable APK is NEVER uploaded and MUST NOT be installed.
      - name: Verify Android package using disposable CI signing identity
        run: |
          keytool -genkeypair -noprompt -keystore debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -dname 'CN=CI Packaging Only,O=SoruLab,C=TR' -keyalg RSA \
            -keysize 2048 -validity 2
          bash ./gradlew :app:assembleDebug --no-daemon --no-configuration-cache --max-workers=2
          test -s app/build/outputs/apk/debug/app-debug.apk
          # Never expose a package with a temporary certificate to the user.
          rm -f debug.keystore my-upload-key.jks app/build/outputs/apk/debug/*.apk
      - name: Restore EXISTING release signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Existing release signing secrets (KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD) must be configured."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          keytool -list -keystore my-upload-key.jks -storepass "$STORE_PASSWORD" -alias upload >/dev/null
          python3 scripts/check_release_oauth_signing.py
      - name: Build signed RC8 validation package with established release certificate
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          bash ./gradlew :app:assembleRelease --no-daemon --no-configuration-cache --max-workers=2
          test -s app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SoruLab-RC9-UNVERIFIED-crop-engine
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
