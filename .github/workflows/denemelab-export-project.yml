name: Export standalone DenemeLab repository

on:
  push:
    branches: [feat/deneme-analizi-skeleton-android]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Prepare independent standalone Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/DenemeLab/app dist/DenemeLab/.github/workflows
          cp -r skeleton/src dist/DenemeLab/app/
          cp skeleton/build.gradle.kts dist/DenemeLab/app/build.gradle.kts
          cp build.gradle.kts gradle.properties gradlew gradlew.bat dist/DenemeLab/
          cp -r gradle dist/DenemeLab/
          cp .gitignore dist/DenemeLab/.gitignore
          cat > dist/DenemeLab/settings.gradle.kts <<'EOF'
          pluginManagement {
            repositories {
              google {
                content {
                  includeGroupByRegex("com\\.android.*")
                  includeGroupByRegex("com\\.google.*")
                  includeGroupByRegex("androidx.*")
                }
              }
              mavenCentral()
              gradlePluginPortal()
            }
          }
          plugins { id("org.gradle.toolchains.foojay-resolver-convention") version "1.0.0" }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "DenemeLab"
          include(":app")
          EOF
          cat > dist/DenemeLab/README.md <<'EOF'
          # DenemeLab
          Premium YKS deneme analizi **Android arayuz iskeleti**. Bu repository, SoruLab'dan bagimsiz olarak derlenir.

          ## Android
          - Java Android native UI, minimum Android 7 (API 24)
          - 4 ekran: Ana Sayfa, Denemeler, Analiz, Hesabim
          - PDF dosya secici aktiftir, analiz ve kalici kayitlar henuz yoktur
          - Tum performans sayilari ornek veridir

          ## Local build
          ```bash
          ./gradlew :app:assembleDebug
          ```
          APK: `app/build/outputs/apk/debug/app-debug.apk`

          ## GitHub Actions
          Push to main triggers an APK build; download artifact **DenemeLab-Android-Preview-APK** from Actions.

          ## Note
          Separate package: `com.denemelab.preview`. No Firebase or production user data is connected.
          EOF
          cat > dist/DenemeLab/.github/workflows/android-apk.yml <<'EOF'
          name: Android preview APK
          on:
            push:
              branches: [main]
            workflow_dispatch:
          permissions:
            contents: read
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: '21'
                - uses: android-actions/setup-android@v3
                  with:
                    packages: platform-tools
                - run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
                - run: bash ./gradlew :app:assembleDebug --no-daemon --no-configuration-cache --max-workers=2
                - run: test -s app/build/outputs/apk/debug/app-debug.apk
                - uses: actions/upload-artifact@v4
                  with:
                    name: DenemeLab-Android-Preview-APK
                    path: app/build/outputs/apk/debug/app-debug.apk
                    if-no-files-found: error
                    retention-days: 30
          EOF
      - name: Verify independent project builds
        run: |
          cd dist/DenemeLab
          bash ./gradlew :app:assembleDebug --no-daemon --no-configuration-cache --max-workers=2
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Make source-only zip
        run: |
          rm -rf dist/DenemeLab/.gradle dist/DenemeLab/app/build dist/DenemeLab/build
          cd dist
          zip -r DenemeLab-Standalone-Repository.zip DenemeLab -x '*/.DS_Store'
      - uses: actions/upload-artifact@v4
        with:
          name: DenemeLab-Standalone-Repository
          path: dist/DenemeLab-Standalone-Repository.zip
          if-no-files-found: error
          retention-days: 30
