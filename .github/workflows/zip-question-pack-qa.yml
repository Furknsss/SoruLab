name: SoruLab premium board and ZIP Android acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - feat/pdf-vision-gemini38-grounded-20261104
    paths:
      - 'app/src/main/java/com/example/util/SoruLabQuestionZipImporter.kt'
      - 'app/src/main/java/com/example/ui/screens/ExamsAndPdfCropperScreen.kt'
      - 'app/src/main/java/com/example/viewmodel/SoruLabViewModel.kt'
      - 'app/src/main/java/com/example/data/SoruLabRepository.kt'
      - 'app/src/main/java/com/example/MainActivity.kt'
      - 'app/src/test/java/com/example/data/QuestionCacheIsolationTest.kt'
      - 'app/src/test/java/com/example/data/LocalQuestionCacheIOTest.kt'
      - 'app/build.gradle.kts'
      - 'app/src/androidTest/java/com/example/util/SoruLabQuestionZipImportDeviceTest.kt'
      - 'app/src/androidTest/java/com/example/util/SoruLabNativeLibrariesDeviceTest.kt'
      - 'scripts/check_apk_integrity.py'
      - 'app/src/main/java/com/example/ui/screens/LiveSolvingBoardScreen.kt'
      - 'app/src/main/java/com/example/ui/screens/HomeAndPracticeScreens.kt'
      - 'app/src/main/java/com/example/ui/screens/PremiumMistakeAnalysisScreen.kt'
      - 'app/src/androidTest/java/com/example/ui/SoruLabDeviceUiSmokeTest.kt'
      - 'app/src/androidTest/java/com/example/ui/SoruLabStylusViewportDeviceTest.kt'
      - '.github/workflows/zip-question-pack-qa.yml'

permissions:
  contents: read

concurrency:
  group: sorulab-zip-device-qa
  cancel-in-progress: true

jobs:
  zip-real-device:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      # Keep the runner's Gradle download independent from the emulator's
      # offline network acceptance test. Cache a checksum-verified distribution.
      - uses: actions/cache@v4
        with:
          path: .ci-gradle/gradle-9.3.1
          key: sorulab-gradle-9.3.1-verified-b266d5ff6b90eada
      - name: Prepare verified Gradle before starting offline emulator
        shell: bash
        run: |
          set -euo pipefail
          version='9.3.1'
          expected='b266d5ff6b90eada6dc3b20cb090e3731302e553a27c5d3e4df1f0d76beaff06'
          gradle_home=".ci-gradle/gradle-$version"
          if [[ ! -x "$gradle_home/bin/gradle" ]]; then
            mkdir -p .ci-gradle
            archive="$RUNNER_TEMP/gradle-$version-bin.zip"
            fetched=false
            for url in \
              "https://downloads.gradle.org/distributions/gradle-$version-bin.zip" \
              "https://services.gradle.org/distributions/gradle-$version-bin.zip"; do
              rm -f "$archive"
              if curl --fail --location --silent --show-error \
                  --retry 2 --retry-all-errors --connect-timeout 20 --max-time 240 \
                  --output "$archive" "$url" && \
                  printf '%s  %s\n' "$expected" "$archive" | sha256sum --check -; then
                unzip -q "$archive" -d .ci-gradle
                fetched=true
                break
              fi
            done
            [[ "$fetched" == true ]]
          fi
          "$gradle_home/bin/gradle" --version
          printf '%s\n' "$GITHUB_WORKSPACE/$gradle_home/bin" >> "$GITHUB_PATH"
      - name: Verify 1400-question persistence and account isolation
        run: |
          gradle :app:testDebugUnitTest --no-daemon --no-configuration-cache --max-workers=2 \
            --tests 'com.example.data.QuestionCacheIsolationTest' \
            --tests 'com.example.data.LocalQuestionCacheIOTest'
      - name: Prepare ephemeral Android signing key
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          keytool -genkeypair -noprompt -keystore debug.keystore \
            -storepass android -keypass androiddebugkey -alias androiddebugkey \
            -dname 'CN=ZIP Import QA,O=SoruLab,C=TR' -keyalg RSA -keysize 2048 -validity 2
      - name: Validate ZIP images and production disk reload, then tablet page and S Pen UX
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: '-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim'
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            adb shell cmd connectivity airplane-mode enable
            adb shell svc wifi disable
            adb shell svc data disable
            gradle :app:connectedDebugAndroidTest --no-daemon --no-configuration-cache --max-workers=2 -Pandroid.testInstrumentationRunnerArguments.class=com.example.util.SoruLabQuestionZipImportDeviceTest,com.example.util.SoruLabNativeLibrariesDeviceTest
            adb shell wm size 1600x2560
            adb shell wm density 240
            gradle :app:connectedDebugAndroidTest --no-daemon --no-configuration-cache --max-workers=2 -Pandroid.testInstrumentationRunnerArguments.class=com.example.ui.SoruLabDeviceUiSmokeTest,com.example.ui.SoruLabStylusViewportDeviceTest
            adb shell wm size reset
            adb shell wm density reset
      - name: Restore existing app signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          keytool -list -keystore my-upload-key.jks -storepass "$STORE_PASSWORD" -alias upload >/dev/null
          python3 scripts/check_release_oauth_signing.py
      - name: Build signed SoruLab APK after successful ZIP device tests
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --no-daemon --no-configuration-cache --max-workers=2
          test -s app/build/outputs/apk/release/app-release.apk
      - name: Verify signed app launches on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: '-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim'
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash scripts/check_signed_apk_install.sh app/build/outputs/apk/release/app-release.apk
      - name: Share signed APK only after complete ZIP accept and launch checks
        uses: actions/upload-artifact@v4
        with:
          name: SoruLab-PREMIUM-BOARD-SIGNED-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sorulab-board-and-zip-device-acceptance
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: ignore
          retention-days: 7
