name: SoruLab Twin Engine Verified Draft QA

on:
  pull_request:
    paths:
      - 'app/src/main/java/com/example/viewmodel/Twin*'
      - 'app/src/main/java/com/example/viewmodel/AiSolverViewModel.kt'
      - 'app/src/main/java/com/example/ui/screens/TwinDiagramCanvas.kt'
      - 'app/src/main/java/com/example/ui/screens/TwinGeneratedIllustration.kt'
      - 'app/src/main/java/com/example/ui/screens/LiveSolvingBoardScreen.kt'
      - 'app/src/debug/**'
      - 'app/src/test/java/com/example/viewmodel/Twin*'
      - 'tools/twin_engine/**'
      - 'app/build.gradle.kts'
      - '.github/workflows/twin-engine-verified-draft-qa.yml'
  workflow_dispatch:

# Cancel stale PR runs while code changes, so only the newest exact commit
# receives the expensive Android emulator visual review.
concurrency:
  group: sorulab-twin-qa
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  math-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Qwen service verification dependencies
        run: pip install -r tools/twin_engine/requirements.txt
      - name: Validate Python service syntax and SymPy tests without a remote model
        run: |
          python -m py_compile tools/twin_engine/app.py tools/twin_engine/math_gate.py
          (cd tools/twin_engine && python -m unittest -v test_math_gate test_service test_nano_banana_provider)

  android-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 36.1 SDK
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0"
      - name: Compile Android application and exercise the twin regression tests
        run: >-
          bash ./gradlew :app:testDebugUnitTest
          --tests 'com.example.viewmodel.TwinLocalTemplateEngineTest'
          --tests 'com.example.viewmodel.TwinDiagramSpecTest'
          --tests 'com.example.viewmodel.TwinRightTriangleTemplateTest'
          --tests 'com.example.viewmodel.TwinDoubleAngleTemplateTest'
          --tests 'com.example.viewmodel.TwinParametricStressTest'
          --tests 'com.example.viewmodel.TwinQuestionQualityGateTest'
          --no-daemon --no-configuration-cache --max-workers=2

      - name: Generate ephemeral debug signing key for preview only
        run: |
          # GitHub runners do not receive the developer's private debug keystore.
          # Generate a disposable standard Android debug key; never touch release keys.
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 365 \
              -dname "CN=Android Debug,O=Android,C=US" -noprompt
          fi
          keytool -list -keystore debug.keystore \
            -storepass android -alias androiddebugkey > /dev/null

      - name: Compile debug app including shape-preview activity
        run: bash ./gradlew :app:assembleDebug --no-daemon --no-configuration-cache --max-workers=2

      - name: Capture real Android triangle twin preview
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: '-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none'
          emulator-boot-timeout: 600
          script: |
            adb shell wm size 720x1280
            adb shell wm density 240
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            mkdir -p out/twin-visual
            # A screenshot that contains a black launch screen or System UI ANR
            # is NOT proof that Compose drew the checked twin. Assert UI semantics.
            READY=0
            for attempt in 1 2 3; do
              adb shell am start -W -n com.aistudio.sorulab.ykslab/com.example.ui.screens.TwinDiagramPreviewActivity || true
              sleep 16
              adb shell uiautomator dump /sdcard/twin-view.xml >/dev/null 2>&1 || true
              adb shell cat /sdcard/twin-view.xml > out/twin-visual/screen.xml 2>/dev/null || true
              if grep -q "SoruLab" out/twin-visual/screen.xml && grep -q "YENİ İKİZ" out/twin-visual/screen.xml; then
                READY=1
                break
              fi
              adb shell input keyevent 4 || true
            done
            test "$READY" -eq 1
            adb exec-out screencap -p > out/twin-visual/native-triangle-twin.png
            pip install -q pillow
            python - <<'PY'
            from PIL import Image
            path = "out/twin-visual/native-triangle-twin.png"
            with Image.open(path) as original:
                image = original.convert("RGB")
                image.thumbnail((160, 240))
                bright = sum(max(p) >= 215 and min(p) >= 185 for p in image.getdata())
                coverage = bright / (image.width * image.height)
                print("Bright canvas fraction", coverage)
                assert coverage > 0.40, "Black screen / system ANR is NOT visual QA"
            PY
            # Verify generated scientific illustration uses its own image surface
            # and leaves the native question/options visible.
            adb shell am start -W -n com.aistudio.sorulab.ykslab/com.example.ui.screens.TwinIllustrationPreviewActivity
            sleep 14
            adb shell uiautomator dump /sdcard/twin-science.xml >/dev/null 2>&1
            adb shell cat /sdcard/twin-science.xml > out/twin-visual/science-view.xml
            grep -q "Biyoloji İkiz Görsel Testi" out/twin-visual/science-view.xml
            grep -q "Stoma" out/twin-visual/science-view.xml
            adb exec-out screencap -p > out/twin-visual/native-science-twin.png
            python - <<'PY'
            from PIL import Image
            with Image.open("out/twin-visual/native-science-twin.png") as p:
                image = p.convert("RGB")
                image.thumbnail((160, 240))
                bright = sum(min(rgb) > 185 for rgb in image.getdata())
                coverage = bright / (image.width * image.height)
                assert coverage > 0.40, "Science preview missing or system ANR"
            PY

      - name: Preserve real rendered native figure screenshot
        uses: actions/upload-artifact@v4
        with:
          name: SoruLab-Twin-Diagram-Android-Visual-QA
          path: |
            out/twin-visual/native-triangle-twin.png
            out/twin-visual/native-science-twin.png
          retention-days: 14

# No APK release or auto-merge. Review tests, actual diagrams, and install upgrade separately.
