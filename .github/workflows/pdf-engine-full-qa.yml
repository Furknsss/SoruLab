name: PDF full QA - all unit tests and Android packaging

on:
  push:
    branches:
      - 'fix/rc9-consensus-no-anchor-regression'
      - 'feat/pdf-vision-gemini38-grounded-20261104'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-full-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-unit-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Reject invalid Kotlin regex literals
        run: python3 scripts/validate_kotlin_raw_regex.py
      - name: Run ALL Android module JVM unit tests
        run: >-
          bash ./gradlew :app:testDebugUnitTest
          --no-daemon --no-configuration-cache --max-workers=2
      - name: Summarize test counts and reject empty report
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = list(Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          if not files:
              raise SystemExit('NO TEST REPORTS: QA gate fails closed')
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for p in files:
              root = ET.parse(p).getroot()
              for k in totals:
                  totals[k] += int(root.get(k, '0'))
          print('PDF FULL QA REPORT:', totals, 'suites:', len(files))
          if totals['tests'] == 0 or totals['failures'] or totals['errors']:
              raise SystemExit('FAIL: missing or failed tests')
          PY
      - name: Build disposable debug package (do not distribute)
        run: |
          keytool -genkeypair -noprompt -keystore debug.keystore \
            -storepass android -keypass androiddebugkey -alias androiddebugkey \
            -dname 'CN=CI Packaging Only,O=SoruLab,C=TR' -keyalg RSA \
            -keysize 2048 -validity 2
          bash ./gradlew :app:assembleDebug \
            --no-daemon --no-configuration-cache --max-workers=2
          test -s app/build/outputs/apk/debug/app-debug.apk
          rm -f debug.keystore app/build/outputs/apk/debug/*.apk
      - name: Preserve full test reports (including failure diagnostics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sorulab-all-unit-tests
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
