name: DenemeLab Android Skeleton APK

on:
  push:
    branches:
      - feat/deneme-analizi-skeleton-android
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: denemelab-skeleton-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-skeleton:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android build tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36.1
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'

      - name: Build standalone skeleton APK
        run: bash ./gradlew :skeleton:assembleDebug --no-daemon --no-configuration-cache --max-workers=2

      - name: Validate generated APK
        run: |
          test -s skeleton/build/outputs/apk/debug/skeleton-debug.apk
          sha256sum skeleton/build/outputs/apk/debug/skeleton-debug.apk
          unzip -t skeleton/build/outputs/apk/debug/skeleton-debug.apk | tail -1

      - name: Upload installable preview APK
        uses: actions/upload-artifact@v4
        with:
          name: DenemeLab-Skeleton-Preview-APK
          path: skeleton/build/outputs/apk/debug/skeleton-debug.apk
          if-no-files-found: error
          retention-days: 30
