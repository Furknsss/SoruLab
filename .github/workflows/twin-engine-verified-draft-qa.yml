name: SoruLab Twin Engine Verified Draft QA

on:
  push:
    branches:
      - feature/twin-diagram-verified-engine-20261111
  pull_request:
    paths:
      - 'app/src/main/java/com/example/viewmodel/Twin*'
      - 'app/src/main/java/com/example/ui/screens/TwinDiagramCanvas.kt'
      - 'tools/twin_engine/**'
      - 'app/build.gradle.kts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  math-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Qwen service verification dependencies
        run: pip install -r tools/twin_engine/requirements.txt
      - name: Validate Python service syntax and SymPy tests without a remote model
        run: |
          python -m py_compile tools/twin_engine/app.py tools/twin_engine/math_gate.py
          (cd tools/twin_engine && python -m unittest -v test_math_gate test_service)

  android-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 36.1 SDK
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0"
      - name: Compile Android application and exercise the twin regression tests
        run: >-
          bash ./gradlew :app:testDebugUnitTest
          --tests 'com.example.viewmodel.TwinLocalTemplateEngineTest'
          --tests 'com.example.viewmodel.TwinDiagramSpecTest'
          --tests 'com.example.viewmodel.TwinRightTriangleTemplateTest'
          --tests 'com.example.viewmodel.TwinDoubleAngleTemplateTest'
          --tests 'com.example.viewmodel.TwinQuestionQualityGateTest'
          --no-daemon --no-configuration-cache --max-workers=2

      - name: Generate ephemeral debug signing key for preview only
        run: |
          # GitHub runners do not receive the developer's private debug keystore.
          # Generate a disposable standard Android debug key; never touch release keys.
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 365 \
              -dname "CN=Android Debug,O=Android,C=US" -noprompt
          fi
          keytool -list -keystore debug.keystore \
            -storepass android -alias androiddebugkey > /dev/null

      - name: Compile debug app including shape-preview activity
        run: bash ./gradlew :app:assembleDebug --no-daemon --no-configuration-cache --max-workers=2

      - name: Capture real Android triangle twin preview
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: '-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none'
          emulator-boot-timeout: 600
          script: |
            adb shell wm size 1200x2000
            adb shell wm density 320
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.aistudio.sorulab.ykslab/com.example.ui.screens.TwinDiagramPreviewActivity
            sleep 5
            mkdir -p out/twin-visual
            adb exec-out screencap -p > out/twin-visual/native-triangle-twin.png
            test "$(stat -c%s out/twin-visual/native-triangle-twin.png)" -gt 20000

      - name: Preserve real rendered native figure screenshot
        uses: actions/upload-artifact@v4
        with:
          name: SoruLab-Twin-Diagram-Android-Visual-QA
          path: out/twin-visual/native-triangle-twin.png
          retention-days: 14

# No APK release or auto-merge. Review tests, actual diagrams, and install upgrade separately.
