name: PDF preview APK
on:
  workflow_dispatch:
  push:
    paths-ignore: ['.qa-encrypted/**']
    branches: ['feat/premium-pdf-v5', 'fix/pdf-rc5-patternsyntax-regression', 'fix/rc7-auth-universal-pdf-layout-ink', 'fix/rc8-pdf-completeness-spen-layout', 'fix/rc9-universal-pdf-ocr-crop-quality', 'fix/rc9-consensus-no-anchor-regression', 'feat/pdf-vision-gemini38-grounded-20261104']
  pull_request:
    branches: ['feat/premium-pdf-v5', 'feat/pdf-v5-biyotik-premium-review', 'feat/s-pen-s9feplus-ink-gestures', 'fix/rc7-auth-universal-pdf-layout-ink', 'fix/rc8-pdf-completeness-spen-layout']
permissions:
  contents: read
# A new commit supersedes old RC8 test runs, preventing dozens of outdated
# Android builds from blocking the current acceptance suite.
concurrency:
  group: pdf-preview-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android platform tools
        uses: android-actions/setup-android@v3
        with:
          # setup-android defaults to the removed "tools" SDK package.
          # Match the existing release workflow instead of installing that default.
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Preflight all literal Kotlin regular expressions
        run: python3 scripts/validate_kotlin_raw_regex.py
      - name: Run all JVM unit tests before signing validation APK
        run: bash ./gradlew :app:testDebugUnitTest --no-daemon --no-configuration-cache --max-workers=2
      - name: Verify unit test XML report is nonempty and failure-free
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = list(Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          if not files:
              raise SystemExit('No unit test report: never distribute unsigned/untested APK')
          totals = {k: 0 for k in ('tests','failures','errors','skipped')}
          for f in files:
              root = ET.parse(f).getroot()
              for k in totals:
                  totals[k] += int(root.get(k,'0'))
          print('RC9 VALIDATION APK QA:',totals,'suites:',len(files))
          if totals['tests']==0 or totals['failures'] or totals['errors']:
              raise SystemExit('QA gate failed; do not upload validation APK')
          PY
      - name: Upload answer-key test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SoruLab-answer-key-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
      # Verify APK packaging independently of the private preview signing key.
      # The disposable APK is NEVER uploaded and MUST NOT be installed.
      - name: Verify Android package using disposable CI signing identity
        run: |
          keytool -genkeypair -noprompt -keystore debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -dname 'CN=CI Packaging Only,O=SoruLab,C=TR' -keyalg RSA \
            -keysize 2048 -validity 2
          bash ./gradlew :app:assembleDebug --no-daemon --no-configuration-cache --max-workers=2
          test -s app/build/outputs/apk/debug/app-debug.apk
          # Never expose a package with a temporary certificate to the user.
          rm -f debug.keystore my-upload-key.jks app/build/outputs/apk/debug/*.apk
      - name: Restore EXISTING release signing identity (must match installed app)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Existing release signing secrets (KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD) must be configured."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          keytool -list -keystore my-upload-key.jks -storepass "$STORE_PASSWORD" -alias upload >/dev/null
          python3 scripts/check_release_oauth_signing.py
      - name: Build signed RC9 TEST package with established release certificate
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          bash ./gradlew :app:assembleRelease --no-daemon --no-configuration-cache --max-workers=2
          test -s app/build/outputs/apk/release/app-release.apk
      - name: Enable emulator virtualization for actual release APK check
        run: sudo chmod a+rw /dev/kvm
      - name: Install and launch the signed APK delivered to testers
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: '-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none'
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash scripts/check_signed_apk_install.sh app/build/outputs/apk/release/app-release.apk
      # The ZIP importer and 10K local-cache gates have previously passed
      # on this feature branch. Publish this exact installed-and-launched
      # release-signed build for direct user installation after JVM QA.
      - name: Verify APK file after signed install and launch
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk
      - name: Upload verified release-signed APK
        uses: actions/upload-artifact@v4
        with:
          name: SoruLab-LATEST-SIGNED-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SoruLab-signed-install-proof
          path: app/build/signed-apk-install/
          if-no-files-found: ignore
          retention-days: 7
