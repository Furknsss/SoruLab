name: SoruLab v1.5.1 Signed In-Place Release

on:
  push:
    branches: [feature/v150-deneme-pen-video-solver]
  workflow_dispatch:

concurrency:
  group: sorulab-v151-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

env:
  APK_FILE: out/SoruLab-v1.5.1.apk
  BASELINE_RELEASE: v1.4.9-preview-20261116
  RELEASE_TAG: v1.5.1-preview-20261122

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore existing release signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          keytool -list -keystore my-upload-key.jks -alias upload -storepass "$STORE_PASSWORD" > /dev/null
          base64 --decode google-services.json.base64 > app/google-services.json
          RELEASE_CERT_SHA1="$(keytool -list -v -keystore my-upload-key.jks -alias upload -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" | awk -F': ' '/SHA1:/{print $2; exit}' | tr -d ':')"
          test -n "$RELEASE_CERT_SHA1"
          RELEASE_CERT_SHA1="$RELEASE_CERT_SHA1" python3 - <<'PY'
          import json, os
          config = json.load(open("app/google-services.json"))
          assert config["project_info"]["project_id"] == "gen-lang-client-0143749618"
          client = next(c for c in config["client"] if c["client_info"]["android_client_info"]["package_name"] == "com.aistudio.sorulab.ykslab")
          oauth = client.get("oauth_client", [])
          assert any(c.get("client_type") == 3 for c in oauth), "Missing Web OAuth client"
          assert any(c.get("client_type") == 1 and c.get("android_info", {}).get("certificate_hash", "").replace(":", "").lower() == os.environ["RELEASE_CERT_SHA1"].lower() for c in oauth), "Release certificate is not registered for Google Sign-In"
          print("Firebase and existing release signing certificate verified")
          PY

      - name: Run verification unit tests
        run: >-
          bash ./gradlew :app:testDebugUnitTest
          --tests 'com.example.data.TopicLectureVideoCatalogTest'
          --tests 'com.example.viewmodel.InteractiveSolutionTest'
          --tests 'com.example.viewmodel.DenemeBlueprintEngineTest'
          --no-daemon --no-configuration-cache --max-workers=2

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          bash ./gradlew :app:assembleRelease --no-daemon --no-configuration-cache --max-workers=2
          mkdir -p out
          APK_PATH="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH"
          cp "$APK_PATH" "$APK_FILE"
          test -s "$APK_FILE" || { echo "::error::Signed APK not produced: $APK_FILE"; exit 1; }
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK_FILE"
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION_NAME" || { echo "::error::Could not read versionName from Gradle"; exit 1; }
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK_FILE" | head -n 1 | grep -F "versionName='$VERSION_NAME'"
          echo "Signed artifact verified: $APK_FILE"

      - name: Verify compatibility with the previously distributed signed v1.4.9 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p baseline
          gh release download "$BASELINE_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir baseline
          OLD_APK="$(find baseline -name '*.apk' -type f -print -quit)"
          test -s "$OLD_APK" || { echo "::error::Baseline APK not found"; exit 1; }
          bash scripts/check_inplace_upgrade.sh "$OLD_APK" "$APK_FILE"
          echo "Previous signed release upgrade compatibility verified: v1.4.9 -> v1.5.1"

      - name: Publish APK as direct GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_FILE" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK_FILE" \
              --repo "$GITHUB_REPOSITORY" \
              --title "SoruLab v1.5.1 — Doğrudan Soru Tipi Konu Anlatımı & Akıllı Çözüm" \
              --notes "v1.4.9 üzerine veri kaybetmeden doğrudan güncellenebilir resmi imzalı sürüm. 100% YKS kazanım ve soru tipi odaklı YouTube video zaman damgası (dakika/saniye) doğrudan başlatma, yerleşik YouTubePlayerView, Photomath/Khanmigo tarzı adım adım akıllı soru çözümü ve sesli asistan desteği." \
              --prerelease --target "$GITHUB_SHA"
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,assets \
            --jq '{url:.url,assets:[.assets[]|{name,url,size}]}'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoruLab-v1.5.1-Signed-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
          retention-days: 30
