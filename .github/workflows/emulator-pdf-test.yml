name: Emulator PDF import test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/src/main/java/com/example/util/**"
      - "app/src/main/java/com/example/viewmodel/**"
      - "app/src/androidTest/**"
      - "scripts/gen_synthetic_book.py"
      - ".github/workflows/emulator-pdf-test.yml"

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK platform and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate synthetic book PDFs
        run: |
          pip install reportlab
          sudo apt-get install -y fonts-dejavu-core > /dev/null
          mkdir -p app/src/androidTest/assets
          python3 scripts/gen_synthetic_book.py app/src/androidTest/assets/synthetic_bottom.pdf app/src/androidTest/assets/synthetic_bottom.json --key-pos bottom
          python3 scripts/gen_synthetic_book.py app/src/androidTest/assets/synthetic_top.pdf app/src/androidTest/assets/synthetic_top.json --key-pos top

      - name: Run import test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          heap-size: 1024M
          disable-animations: true
          script: |
            bash ./gradlew :app:connectedDebugAndroidTest --no-daemon --no-configuration-cache --max-workers=2 || echo FAILED > emulator_failed.flag
            mkdir -p emulator-out
            adb pull /sdcard/Android/data/com.aistudio.sorulab.ykslab/files emulator-out || true
            cat emulator-out/files/report_*.txt || true
            test ! -f emulator_failed.flag

      - name: Upload reports and cropped images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-results
          path: |
            emulator-out
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
          if-no-files-found: ignore
